name: Build HideBar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Roothide, Rootless & Rootful (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Roothide Theos & iOS Toolchain
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Build Roothide (.deb)
        run: |
          mkdir -p dist/roothide
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          cp packages/*.deb dist/roothide/

      - name: Build Rootless (.deb)
        run: |
          mkdir -p dist/rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb dist/rootless/

      - name: Build Rootful (.deb)
        run: |
          mkdir -p dist/rootful
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb dist/rootful/

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: HideBar-deb-packages
          path: dist/**/*.deb

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/roothide/*.deb
            dist/rootless/*.deb
            dist/rootful/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
