name: Build HideBar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Roothide, Rootless & Rootful (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Roothide Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git xz-utils libtinfo6 libxml2-dev
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          "$THEOS/bin/install-sdk" latest

      - name: Build Roothide (.deb)
        run: |
          mkdir -p dist/roothide
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          cp packages/*.deb dist/roothide/

      - name: Build Rootless (.deb)
        run: |
          mkdir -p dist/rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb dist/rootless/

      - name: Build Rootful (.deb)
        run: |
          mkdir -p dist/rootful
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb dist/rootful/

      - name: Verify Built Packages
        run: |
          for f in dist/*/*.deb; do
            echo "=== $f ==="
            dpkg-deb -I "$f"
            dpkg-deb -c "$f"
          done

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: HideBar-deb-packages
          path: dist/**/*.deb

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/roothide/*.deb
            dist/rootless/*.deb
            dist/rootful/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
